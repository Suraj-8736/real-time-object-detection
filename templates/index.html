<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Real-Time Object Detection</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Real-Time Object Detection</h1>

        <p class="subtitle">
            AI-powered object detection using YOLO and OpenCV
        </p>

        <div class="camera-box">

            <img src="{{ url_for('video') }}" alt="Camera Feed">

        </div>

        <div class="info">

            <div class="card">
                <h3>Technology</h3>
                <p>YOLO + OpenCV</p>
            </div>

            <div class="card">
                <h3>Mode</h3>
                <p>Real-Time</p>
            </div>

            <div class="card">
                <h3>Status</h3>
                <p class="active">● Camera Active</p>
            </div>

        </div>

    </div>

</body>

</html>
